name: Deploy and refresh data

on:
  push:
  schedule:
    # Mondays 03:17 Singapore time (Sundays 19:17 UTC)
    - cron: '17 19 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Only the default branch is published.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Refresh HDB car park list
        if: github.event_name != 'push'
        # A data.gov.sg outage should not block the deploy; the existing list is kept.
        continue-on-error: true
        run: |
          npm run data:hdb
          if ! git diff --quiet -- public/data/hdb-carparks.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/hdb-carparks.json
            git commit -m "Refresh HDB car park list"
            git push
          fi

      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
